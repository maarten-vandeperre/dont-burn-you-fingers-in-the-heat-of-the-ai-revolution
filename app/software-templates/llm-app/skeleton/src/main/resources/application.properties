quarkus.application.name=${{ values.name }}
app.description=${{ values.description }}

# Chosen in Developer Hub
app.use-case=${{ values.useCase }}
app.size=${{ values.size }}
app.max-input-chars=${{ values.maxChars }}

# Model access: the platform's Models-as-a-Service gateway (OpenAI compatible). The model for this
# use case is chosen by the platform; LLM_BASE_URL / LLM_MODEL / LLM_API_KEY override everything,
# e.g. Podman Desktop AI Lab locally: LLM_BASE_URL=http://localhost:35000/v1
quarkus.langchain4j.openai.base-url=${LLM_BASE_URL:https://maas.${{ values.appsDomain }}/maas-models/${{ values.modelId }}/v1}
quarkus.langchain4j.openai.chat-model.model-name=${LLM_MODEL:${{ values.modelId }}}
quarkus.langchain4j.openai.api-key=${LLM_API_KEY:set-LLM_API_KEY}
quarkus.langchain4j.openai.chat-model.max-tokens=${{ values.maxTokens }}
quarkus.langchain4j.openai.chat-model.temperature=0.3
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.openai.log-requests=false
# lab clusters often use self-signed router certificates
quarkus.tls.llm.trust-all=${LLM_TRUST_ALL:true}
quarkus.langchain4j.openai.tls-configuration-name=llm

quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector.tracing-system.svc.cluster.local:4317}
%dev.quarkus.otel.sdk.disabled=true
