# Developer Hub software template: a small application that answers questions with a model managed
# by the platform. The platform maps
#   use case  -> system prompt (UseCase.java in the skeleton) and, unless a model is picked, the model
#   model     -> optional: any model OpenShift AI serves through MaaS (catalog Resource, tag vllm)
#   t-shirt   -> max input text and answer length
# The result: GitLab repository with TechDocs (mkdocs.yml, docs/), catalog entry, and an Argo CD
# application (argocd:create-resources) that deploys deploy/ and starts the first build.
# __GITLAB_HOST__ / __APPS_DOMAIN__ are filled in by ./deploy.sh gitlab when this repo is pushed.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: llm-app
  title: LLM application (Quarkus, LangChain4j, React)
  description: >-
    A small question answering application on the platform's models. You pick the use case, the
    size and (optionally) the model from the OpenShift AI catalog. Generates the code, a GitLab
    repository, TechDocs, OpenShift manifests and the catalog entry, and deploys it with Argo CD.
  tags: [recommended, quarkus, langchain4j, react, ai, argocd, techdocs]
  links:
    - url: https://__GITLAB_HOST__/ai-platform/platform/-/tree/main/app/software-templates/llm-app
      title: Template source
spec:
  owner: group:default/platform-team
  type: service

  parameters:
    - title: Metadata
      required: [name, description, packageName]
      properties:
        name:
          title: Name
          type: string
          description: Used for the repository, the OpenShift project and the catalog entry
          pattern: '^[a-z]([-a-z0-9]{0,30}[a-z0-9])?$'
          ui:autofocus: true
          ui:help: "Lower case letters, digits and dashes, e.g. recipe-helper"
        description:
          title: Description
          type: string
          maxLength: 200
          ui:help: One sentence about what the application is for
        packageName:
          title: Package name
          type: string
          default: org.acme.llm
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
          ui:help: "Java package of the generated code, e.g. com.example.recipes"

    - title: Model selection
      required: [useCase, size]
      properties:
        useCase:
          title: Use case
          type: string
          default: OVERALL_KNOWLEDGE
          enum: [OVERALL_KNOWLEDGE, CODING_QUESTIONS, MEDICAL_QUESTIONS, FOOD_QUESTIONS]
          enumNames: [OVERALL KNOWLEDGE, CODING QUESTIONS, MEDICAL QUESTIONS, FOOD QUESTIONS]
          ui:help: The platform selects and operates the model that fits this use case.
        size:
          title: T-shirt size
          type: string
          default: SMALL
          enum: [SMALL, MEDIUM, LARGE]
          enumNames:
            - SMALL (max 200 characters text)
            - MEDIUM (max 1000 characters text)
            - LARGE (max 5000 characters text)
        model:
          title: Model (optional)
          type: string
          description: >-
            A model OpenShift AI serves through Models-as-a-Service (see the AI Catalog). Leave it
            empty and the platform picks the model that fits the use case.
          ui:field: EntityPicker
          ui:options:
            allowArbitraryValues: false
            defaultKind: Resource
            catalogFilter:
              - kind: Resource
                spec.type: ai-model
                metadata.tags: vllm

  steps:
    - id: fetch
      name: Generate the project
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - gradlew
          - gradlew.bat
          - gradle/wrapper/*
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          packageName: ${{ parameters.packageName }}
          packagePath: ${{ parameters.packageName | replace(".", "/") }}
          useCase: ${{ parameters.useCase }}
          size: ${{ parameters.size }}
          # the model picked in the form, else the platform policy for the use case
          modelId: ${{ (parameters.model | parseEntityRef | pick('name')) if parameters.model else ("gemma-3-270m-it" if parameters.useCase == "FOOD_QUESTIONS" else "qwen3-0-6b") }}
          modelSource: ${{ "the developer, in the Developer Hub template" if parameters.model else "the platform policy for the use case " + parameters.useCase }}
          maxChars: ${{ 200 if parameters.size == "SMALL" else (1000 if parameters.size == "MEDIUM" else 5000) }}
          maxTokens: ${{ 256 if parameters.size == "SMALL" else (512 if parameters.size == "MEDIUM" else 1024) }}
          gitlabHost: __GITLAB_HOST__
          appsDomain: __APPS_DOMAIN__

    - id: publish
      name: Create the GitLab repository
      action: publish:gitlab
      input:
        repoUrl: __GITLAB_HOST__?owner=ai-platform&repo=${{ parameters.name }}
        # Backstage 1.54 (Developer Hub 2.1): GitLab project fields go under settings
        settings:
          description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    # GitOps: an Argo CD project + application (OpenShift GitOps) that syncs deploy/ into the
    # namespace <name>; the BuildConfig in there starts the first build on its own
    - id: argocd
      name: Deploy with Argo CD
      action: argocd:create-resources
      input:
        appName: ${{ parameters.name }}
        argoInstance: openshift-gitops
        namespace: ${{ parameters.name }}
        repoUrl: https://__GITLAB_HOST__/ai-platform/${{ parameters.name }}.git
        path: deploy
        labelValue: ${{ parameters.name }}

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in the catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Argo CD application
        url: https://openshift-gitops-server-openshift-gitops.__APPS_DOMAIN__/applications/openshift-gitops/${{ parameters.name }}
      - title: Open the application (after the first build, ~5 min)
        url: https://${{ parameters.name }}-${{ parameters.name }}.__APPS_DOMAIN__
    text:
      - title: Next steps
        content: |
          Argo CD deploys `deploy/` into the namespace `${{ parameters.name }}` and the first build
          starts by itself (catalog > ${{ parameters.name }} > CD and Topology tabs). The
          documentation is on the Docs tab. Give the application its MaaS API key:

              oc create secret generic llm-credentials -n ${{ parameters.name }} --from-literal=LLM_API_KEY=<your MaaS API key>
              oc rollout restart deployment/${{ parameters.name }} -n ${{ parameters.name }}
