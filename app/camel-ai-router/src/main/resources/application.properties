quarkus.application.name=camel-ai-router
quarkus.http.port=8080

# --- OpenAI (online) -----------------------------------------------------------------------
# Base URL can be overridden to point at any OpenAI-compatible proxy sitting where OpenAI
# normally is. "Configured" (for routing purposes) means OPENAI_API_KEY is set.
quarkus.rest-client.openai.url=${OPENAI_BASE_URL:https://api.openai.com}
quarkus.rest-client.openai.read-timeout=60000
router.openai.api-key=${OPENAI_API_KEY:}
router.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# --- Anthropic (online) --------------------------------------------------------------------
# Native Messages API; AnthropicGateway translates to/from the OpenAI shape. "Configured" means
# ANTHROPIC_API_KEY is set.
quarkus.rest-client.anthropic.url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
quarkus.rest-client.anthropic.read-timeout=60000
router.anthropic.api-key=${ANTHROPIC_API_KEY:}
router.anthropic.model=${ANTHROPIC_MODEL:claude-3-5-haiku-latest}
router.anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:1024}

# --- vLLM, "online" through OpenShift AI Models-as-a-Service (or any OpenShift route) ------
# "Configured" means VLLM_BASE_URL is set; the API key is optional (gateway dependent).
# router.vllm.base-url is the one read for the "configured" check; VLLM_TRUST_ALL skips
# certificate validation for self-signed lab ingress certificates (this client only).
router.vllm.base-url=${VLLM_BASE_URL:}
quarkus.rest-client.vllm.url=${VLLM_BASE_URL:http://localhost:9999}
quarkus.rest-client.vllm.read-timeout=120000
quarkus.rest-client.vllm.tls-configuration-name=vllm
quarkus.tls.vllm.trust-all=${VLLM_TRUST_ALL:false}
router.vllm.api-key=${VLLM_API_KEY:}
router.vllm.model=${VLLM_MODEL:}

# --- local model (the fallback target, and the default when OpenAI is not configured) -----
# Any OpenAI-compatible server: Ollama, llama.cpp, vLLM, Podman Desktop AI Lab, ... From inside
# a container the laptop is host.containers.internal, not localhost (see compose.yaml / README).
# "Configured" means LOCAL_BASE_URL is set; the API key is optional (most local servers need none).
router.local.base-url=${LOCAL_BASE_URL:}
quarkus.rest-client.local.url=${LOCAL_BASE_URL:http://localhost:11434}
quarkus.rest-client.local.read-timeout=120000
router.local.api-key=${LOCAL_API_KEY:}
router.local.model=${LOCAL_MODEL:}

# --- circuit breaker + fallback policy (per online provider: openai, anthropic, vllm) ------
# Per-call safety net (Camel circuitBreaker() EIP, MicroProfile Fault Tolerance): a timeout, and
# -- within a rolling window of "failure-threshold" calls -- opens once ALL of them failed,
# staying open ("delay") for "open-minutes". Falls back to the local model on ANY failure
# (immediate failure, or the breaker already open) when a local model is configured; otherwise
# the error is returned to the caller.
router.breaker.failure-threshold=${BREAKER_FAILURE_THRESHOLD:5}
router.breaker.window-minutes=${BREAKER_WINDOW_MINUTES:2}
router.breaker.open-minutes=${BREAKER_OPEN_MINUTES:5}
router.breaker.timeout-ms=${BREAKER_TIMEOUT_MS:60000}
# Per-provider overrides, e.g.:
#   router.breaker.openai.failure-threshold=3
#   router.breaker.anthropic.open-minutes=10

quarkus.camel.metrics.enable-route-policy=true
%dev.quarkus.log.console.json.enabled=false

# --- Hawtio: live Camel route console, linked from /admin ----------------------------------
# Demo app, no users configured, so authentication is off; see README "Admin page & Hawtio".
quarkus.hawtio.authenticationEnabled=false
# Enables the Camel plugin's "Debug" tab in Hawtio (set a breakpoint on a route, inspect/edit
# the in-flight message, then let it continue) -- otherwise only on in dev mode by default.
quarkus.camel.debug.enabled=true
