quarkus.application.name=projection-service
quarkus.http.port=8080

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:platform-kafka-bootstrap.kafka.svc.cluster.local:9092}

mp.messaging.incoming.customers.connector=smallrye-kafka
mp.messaging.incoming.customers.topic=inventory.inventory.customers
mp.messaging.incoming.customers.group.id=projection-service
mp.messaging.incoming.customers.auto.offset.reset=earliest
mp.messaging.incoming.customers.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.customers.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.orders.connector=smallrye-kafka
mp.messaging.incoming.orders.topic=inventory.inventory.orders
mp.messaging.incoming.orders.group.id=projection-service
mp.messaging.incoming.orders.auto.offset.reset=earliest
mp.messaging.incoming.orders.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

quarkus.mongodb.connection-string=${MONGODB_URL:mongodb://mongodb:27017}
quarkus.mongodb.tracing.enabled=true
projection.database=projections

quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector.tracing-system.svc.cluster.local:4317}
quarkus.kafka.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.otel.sdk.disabled=true

# coffee shop audit trail (Debezium topics of the coffee schema)
mp.messaging.incoming.coffee-orders.connector=smallrye-kafka
mp.messaging.incoming.coffee-orders.topic=inventory.coffee.orders
mp.messaging.incoming.coffee-orders.group.id=projection-service-coffee
mp.messaging.incoming.coffee-orders.auto.offset.reset=earliest
mp.messaging.incoming.coffee-orders.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.coffee-orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.incoming.coffee-lines.connector=smallrye-kafka
mp.messaging.incoming.coffee-lines.topic=inventory.coffee.order_lines
mp.messaging.incoming.coffee-lines.group.id=projection-service-coffee
mp.messaging.incoming.coffee-lines.auto.offset.reset=earliest
mp.messaging.incoming.coffee-lines.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.coffee-lines.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
