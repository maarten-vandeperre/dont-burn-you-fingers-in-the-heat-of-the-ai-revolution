# Optional: build from git with OpenShift Pipelines instead of binary builds.
#   oc apply -k app/deploy/pipelines
#   app/demo.sh pipeline <git-url> [revision]   (creates one PipelineRun per service)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-demo
resources:
  - pipeline.yaml
