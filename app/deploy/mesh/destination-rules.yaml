# Subsets for the deployment patterns (the version label of the pods)
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: rag-service
spec:
  host: rag-service
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: coffee-menu
spec:
  host: coffee-menu
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
