# Default route for the rag-service: all traffic to v1. app/demo.sh pattern <name> replaces it.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rag-service
  namespace: ai-demo
spec:
  hosts: [rag-service]
  http:
    - route:
        - destination: {host: rag-service, subset: v1}
          weight: 100
