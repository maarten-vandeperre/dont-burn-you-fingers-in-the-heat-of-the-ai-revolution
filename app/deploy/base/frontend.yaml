apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    backstage.io/kubernetes-id: frontend
    app.kubernetes.io/part-of: ai-demo
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
    version: v1
    app.kubernetes.io/part-of: ai-demo
    backstage.io/kubernetes-id: frontend
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"rag-service-v1"},{"apiVersion":"apps/v1","kind":"Deployment","name":"rag-service-v2"},{"apiVersion":"apps/v1","kind":"Deployment","name":"orders-service"},{"apiVersion":"apps/v1","kind":"Deployment","name":"projection-service"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
        backstage.io/kubernetes-id: frontend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /q/metrics
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: frontend
      containers:
      - name: app
        image: frontend:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: OTEL_ENDPOINT
          value: http://otel-collector.tracing-system.svc.cluster.local:4317
        - name: RAG_URL
          value: http://rag-service:8080
        - name: ORDERS_URL
          value: http://orders-service:8080
        - name: PROJECTION_URL
          value: http://projection-service:8080
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
