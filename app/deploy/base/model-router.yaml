apiVersion: v1
kind: Service
metadata:
  name: model-router
  labels:
    app: model-router
    backstage.io/kubernetes-id: model-router
    app.kubernetes.io/part-of: ai-demo
spec:
  selector:
    app: model-router
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-router
  labels:
    app: model-router
    version: v1
    app.kubernetes.io/part-of: ai-demo
    backstage.io/kubernetes-id: model-router
    app.openshift.io/runtime: quarkus
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"model-router:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-router
      version: v1
  template:
    metadata:
      labels:
        app: model-router
        version: v1
        backstage.io/kubernetes-id: model-router
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /q/metrics
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: model-router
      containers:
      - name: app
        image: model-router:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: OTEL_ENDPOINT
          value: http://otel-collector.tracing-system.svc.cluster.local:4317
        - name: MAAS_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-router-secrets
              key: MAAS_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-router-secrets
              key: OPENAI_API_KEY
              optional: true
        envFrom:
        - configMapRef:
            name: ai-demo-config
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
