apiVersion: v1
kind: Service
metadata:
  name: orders-service
  labels:
    app: orders-service
    backstage.io/kubernetes-id: orders-service
    app.kubernetes.io/part-of: ai-demo
spec:
  selector:
    app: orders-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  labels:
    app: orders-service
    version: v1
    app.kubernetes.io/part-of: ai-demo
    backstage.io/kubernetes-id: orders-service
    app.openshift.io/runtime: quarkus
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"orders-service:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
      version: v1
  template:
    metadata:
      labels:
        app: orders-service
        version: v1
        backstage.io/kubernetes-id: orders-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /q/metrics
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
    spec:
      serviceAccountName: orders-service
      containers:
      - name: app
        image: orders-service:latest
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: OTEL_ENDPOINT
          value: http://otel-collector.tracing-system.svc.cluster.local:4317
        - name: DB_URL
          value: jdbc:postgresql://inventory-db.kafka.svc.cluster.local:5432/inventory
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: inventory-db
              key: admin-password
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
