# Binary Docker builds: demo.sh build uploads the app/ folder and builds in the cluster.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: rag-service
  labels:
    app: rag-service
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      buildArgs:
        - name: SERVICE
          value: rag-service
  output:
    to:
      kind: ImageStreamTag
      name: rag-service:latest
  resources:
    limits:
      memory: 3Gi
