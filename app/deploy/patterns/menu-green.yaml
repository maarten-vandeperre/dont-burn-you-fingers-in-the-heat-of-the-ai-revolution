# Blue-green: green (v2) live, the shop prices with the new menu at once.   ./deploy.sh app menu green
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: coffee-menu
  namespace: ai-demo
spec:
  hosts: [coffee-menu]
  http:
    - route:
        - destination: {host: coffee-menu, subset: v2}
      headers:
        response:
          set:
            x-deployment-color: green
