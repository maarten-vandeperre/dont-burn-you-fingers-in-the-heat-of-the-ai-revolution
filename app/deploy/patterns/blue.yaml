# Blue-green: blue (v1) is live. Switch with: app/demo.sh pattern green (instant, and back).
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rag-service
  namespace: ai-demo
spec:
  hosts: [rag-service]
  http:
    - route:
        - destination: {host: rag-service, subset: v1}
      headers:
        response:
          set:
            x-deployment-color: blue
