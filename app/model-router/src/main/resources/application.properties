quarkus.application.name=model-router
quarkus.http.port=8080

# Models-as-a-Service gateway (path based routing). The cluster domain comes from the ai-demo-config
# ConfigMap (MAAS_URL). Lab clusters often use a self signed ingress certificate: MAAS_TRUST_ALL=true.
quarkus.rest-client.maas.url=${MAAS_URL:https://maas.apps.example.com}
quarkus.rest-client.maas.tls-configuration-name=maas
quarkus.rest-client.maas.read-timeout=120000
quarkus.tls.maas.trust-all=${MAAS_TRUST_ALL:false}
router.maas.api-key=${MAAS_API_KEY:}
router.maas.namespace=maas-models
router.maas.models.gemma=gemma-3-270m-it
router.maas.models.qwen=qwen3-0-6b

quarkus.rest-client.openai.url=https://api.openai.com
quarkus.rest-client.openai.read-timeout=60000
router.openai.api-key=${OPENAI_API_KEY:}
router.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# observability: OTLP traces to the platform collector, Camel route metrics, JSON logs with trace ids
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector.tracing-system.svc.cluster.local:4317}
quarkus.camel.metrics.enable-route-policy=true
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.otel.sdk.disabled=true
