quarkus.application.name=coffee-shop
quarkus.http.port=8080

# LangChain4j -> model-router (Camel). COFFEE_MODEL picks the alias: qwen | gemma | openai | auto
quarkus.langchain4j.openai.base-url=${ROUTER_URL:http://localhost:8081/v1}
quarkus.langchain4j.openai.api-key=handled-by-model-router
quarkus.langchain4j.openai.chat-model.model-name=${COFFEE_MODEL:qwen}
quarkus.langchain4j.openai.chat-model.max-tokens=300
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.timeout=120s
# prompts and completions on the LangChain4j spans, so MLflow shows what the model saw and said
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true
# link from the UI to the MLflow experiment (written by app/demo.sh setup)
coffee.mlflow-url=${MLFLOW_UI_URL:}

# coffee-menu through the mesh; the 5 s read timeout lets the probe show injected delays,
# the order flow itself gives up after 1.5 s and uses the cached menu (MenuService)
quarkus.rest-client.coffee-menu.url=${MENU_URL:http://coffee-menu:8080}
quarkus.rest-client.coffee-menu.read-timeout=5000
quarkus.rest-client.coffee-menu.connect-timeout=2000
quarkus.rest-client.projection.url=${PROJECTION_URL:http://projection-service:8080}

# orders live in the Debezium source database, schema "coffee" (tables created by the seed)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://inventory-db.kafka.svc.cluster.local:5432/inventory}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.telemetry=true

quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector.tracing-system.svc.cluster.local:4317}
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.otel.sdk.disabled=true
