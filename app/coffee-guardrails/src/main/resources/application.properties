quarkus.application.name=coffee-guardrails
quarkus.http.port=8080

# One guardrails server per model provider, all with the same rules (guardrails/config/coffee).
# The model endpoints and keys live on the guardrails servers (MAIN_MODEL_BASE_URL, OPENAI_API_KEY),
# never in this app; the app only sends the model name.
providers.qwen.url=${QWEN_GUARDRAILS_URL:http://localhost:8000}
providers.qwen.model=${QWEN_MODEL:qwen}
providers.openai.url=${OPENAI_GUARDRAILS_URL:http://localhost:8001}
providers.openai.model=${OPENAI_MODEL:gpt-4o-mini}
providers.default=${DEFAULT_PROVIDER:qwen}
guardrails.config-id=${GUARDRAILS_CONFIG_ID:coffee}

shop.timezone=${SHOP_TIMEZONE:Europe/Brussels}

coffee.system-prompt=You are the friendly order assistant of Platform Coffee. You only help with coffee orders: \
espresso, americano, cappuccino, latte, flat white, mocha, sizes small/regular/large, milk dairy/oat/soy, decaf. \
Prices in EUR: espresso 2.50, americano 3.00, cappuccino 3.80, latte 4.00, flat white 4.00, mocha 4.50, \
large +0.70, oat or soy +0.40. Confirm the order and the total. Answer in at most 200 characters.
