# The coffee app on OpenShift (build from a clean copy, never with .env: it holds your keys):
#   src=$(mktemp -d) && rsync -a --exclude .env --exclude build --exclude .gradle --exclude node_modules ./ "$src"/ \
#     && oc start-build coffee-app -n coffee-guardrails --from-dir="$src" --follow; rm -rf "$src"
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: coffee-app
  namespace: coffee-guardrails
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: coffee-app
  namespace: coffee-guardrails
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: coffee-app:latest
  resources:
    limits:
      memory: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-app
  namespace: coffee-guardrails
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"coffee-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coffee-app
  template:
    metadata:
      labels:
        app: coffee-app
    spec:
      containers:
        - name: app
          image: coffee-app:latest
          ports:
            - containerPort: 8080
          env:                              # services created by the TrustyAI operator
            - name: QWEN_GUARDRAILS_URL
              value: http://coffee-guardrails.coffee-guardrails.svc:8000
            - name: QWEN_MODEL
              value: qwen3-0-6b
            - name: OPENAI_GUARDRAILS_URL
              value: http://coffee-guardrails-openai.coffee-guardrails.svc:8000
            - name: OPENAI_MODEL
              value: gpt-4o-mini
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-app
  namespace: coffee-guardrails
spec:
  selector:
    app: coffee-app
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: coffee-app
  namespace: coffee-guardrails
spec:
  to:
    kind: Service
    name: coffee-app
  tls:
    termination: edge
