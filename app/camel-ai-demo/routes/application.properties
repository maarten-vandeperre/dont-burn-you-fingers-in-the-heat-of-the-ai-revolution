# Loaded automatically from the source directory. Values come from config/llm.env (environment),
# with defaults, so no key is ever written into a route.
camel.main.name = camel-ai-demo

# providers
qwen.base-url = {{env:QWEN_BASE_URL:http://localhost:35000/v1}}
qwen.model = {{env:QWEN_MODEL:qwen}}
qwen.api-key = {{env:QWEN_API_KEY:not-needed}}

openai.base-url = {{env:OPENAI_BASE_URL:https://api.openai.com/v1}}
openai.api-key = {{env:OPENAI_API_KEY:}}
openai.model = {{env:OPENAI_MODEL:gpt-4o-mini}}

anthropic.base-url = {{env:ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}}
anthropic.api-key = {{env:ANTHROPIC_API_KEY:}}
anthropic.model = {{env:ANTHROPIC_MODEL:claude-haiku-4-5-20251001}}

# behaviour
llm.fallback = {{env:LLM_FALLBACK:anthropic}}
llm.local-timeout-ms = {{env:LLM_LOCAL_TIMEOUT_MS:60000}}

# circuit breaker of the alias "auto" (local model first, cloud fallback)
camel.resilience4j.timeout-enabled = true
camel.resilience4j.timeout-duration = {{llm.local-timeout-ms}}
camel.resilience4j.minimum-number-of-calls = 3
camel.resilience4j.failure-rate-threshold = 50
camel.resilience4j.wait-duration-in-open-state = 30
llm.max-tokens = {{env:LLM_MAX_TOKENS:512}}
llm.system-prompt = You are a concise assistant for a coffee shop platform team. Answer in at most five sentences.

# file routes
demo.inbox = data/inbox
demo.outbox = data/outbox
demo.files.provider = {{env:FILES_PROVIDER:auto}}
