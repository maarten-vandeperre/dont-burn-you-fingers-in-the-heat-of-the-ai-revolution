quarkus.application.name=orders-service
quarkus.http.port=8080

# The Debezium source database (stack/kafka/inventory-db). The tables already exist.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://inventory-db.kafka.svc.cluster.local:5432/inventory}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.telemetry=true
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector.tracing-system.svc.cluster.local:4317}
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.otel.sdk.disabled=true
