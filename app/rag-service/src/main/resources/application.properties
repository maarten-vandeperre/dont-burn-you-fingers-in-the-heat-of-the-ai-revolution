quarkus.application.name=rag-service
quarkus.http.port=8080

app.version=${APP_VERSION:v1}
rag.top-k=${RAG_TOP_K:3}

# default (unnamed) model, only so the extension has a complete configuration
quarkus.langchain4j.openai.base-url=${ROUTER_URL:http://localhost:8081/v1}
quarkus.langchain4j.openai.api-key=handled-by-model-router
quarkus.langchain4j.openai.chat-model.model-name=auto

# Four named LangChain4j models, one per alias, all served by the model-router (Camel).
# ROUTER_URL = http://model-router:8080/v1 in the cluster. The router holds the real API keys.
quarkus.langchain4j.openai.gemma.base-url=${ROUTER_URL:http://localhost:8081/v1}
quarkus.langchain4j.openai.gemma.api-key=handled-by-model-router
quarkus.langchain4j.openai.gemma.chat-model.model-name=gemma
quarkus.langchain4j.openai.gemma.chat-model.max-tokens=300
quarkus.langchain4j.openai.gemma.timeout=120s

quarkus.langchain4j.openai.qwen.base-url=${ROUTER_URL:http://localhost:8081/v1}
quarkus.langchain4j.openai.qwen.api-key=handled-by-model-router
quarkus.langchain4j.openai.qwen.chat-model.model-name=qwen
quarkus.langchain4j.openai.qwen.chat-model.max-tokens=300
quarkus.langchain4j.openai.qwen.timeout=120s

quarkus.langchain4j.openai.openai.base-url=${ROUTER_URL:http://localhost:8081/v1}
quarkus.langchain4j.openai.openai.api-key=handled-by-model-router
quarkus.langchain4j.openai.openai.chat-model.model-name=openai
quarkus.langchain4j.openai.openai.chat-model.max-tokens=400
quarkus.langchain4j.openai.openai.timeout=60s

quarkus.langchain4j.openai.auto.base-url=${ROUTER_URL:http://localhost:8081/v1}
quarkus.langchain4j.openai.auto.api-key=handled-by-model-router
quarkus.langchain4j.openai.auto.chat-model.model-name=auto
quarkus.langchain4j.openai.auto.chat-model.max-tokens=300
quarkus.langchain4j.openai.auto.timeout=150s

quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false

quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://otel-collector.tracing-system.svc.cluster.local:4317}
%dev.quarkus.log.console.json.enabled=false
%dev.quarkus.otel.sdk.disabled=true
