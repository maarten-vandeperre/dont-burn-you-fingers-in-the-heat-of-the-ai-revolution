# Argo CD Applications for the OpenShift 4.22 platform stack. Rendered and applied by
# "./deploy.sh stack-argocd" (same placeholders as applications.yaml). Together with
# applications.yaml (MaaS) and observability-application.yaml they describe the whole platform.
# Apps converge through retries: CRDs appear while operators install.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stack-operators
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: ai-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: __REPO_PATH__stack/operators
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
