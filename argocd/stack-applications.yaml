  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: __REPO_PATH__stack/servicemesh
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # OpenShift adds image pull secrets to every ServiceAccount (bookinfo demo)
    - kind: ServiceAccount
      jqPathExpressions:
        - .imagePullSecrets
