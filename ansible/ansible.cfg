; Project-local config so `ansible-playbook` behaves the same on a laptop and inside AAP's
; execution environment. AAP ignores most of [defaults] (it sets its own inventory/roles paths)
; but honours this file for things like collections_path and host_key_checking when a playbook
; is run from this directory -- keep it anyway so `ansible-playbook playbooks/check_postgres.yml`
; works unchanged on a laptop for fast iteration (see README.md "Run it from your laptop first").
[defaults]
inventory = inventory/hosts.ini
collections_path = ./collections:~/.ansible/collections
roles_path = ./roles
retry_files_enabled = False
stdout_callback = yaml
nocows = 1

[persistent_connection]
command_timeout = 60
