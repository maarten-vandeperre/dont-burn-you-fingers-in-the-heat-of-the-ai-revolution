# Deletes the demo PostgreSQL: Deployment, Service, PVC and the credentials Secret, in that order
# (workload first, so nothing keeps trying to mount a PVC that is being removed).
#
# Only ever reached after a human has approved a Workflow Approval node -- never run directly by
# either workflow without that gate in front of it (see README.md "Manual approval: how it
# actually blocks the delete" and ansible/workflows/*.json). Running it by hand
# (`ansible-playbook playbooks/delete_postgres.yml`) skips that gate entirely, which is the point
# when you are iterating on the playbook itself -- just know that's what you are doing.
#
# Idempotent: state: absent on an object that is already gone is a no-op, not an error.
---
- name: Delete the demo PostgreSQL
  hosts: demo
  gather_facts: false
  tasks:
    - name: Deployment
      kubernetes.core.k8s:
        state: absent
        wait: true
        wait_timeout: 120
        api_version: apps/v1
        kind: Deployment
        name: "{{ postgres_app_name }}"
        namespace: "{{ postgres_namespace }}"

    - name: Service
      kubernetes.core.k8s:
        state: absent
        kind: Service
        name: "{{ postgres_app_name }}"
        namespace: "{{ postgres_namespace }}"

    - name: PersistentVolumeClaim (the actual data -- gone after this task)
      kubernetes.core.k8s:
        state: absent
        kind: PersistentVolumeClaim
        name: "{{ postgres_app_name }}-data"
        namespace: "{{ postgres_namespace }}"

    - name: Credentials Secret
      kubernetes.core.k8s:
        state: absent
        kind: Secret
        name: "{{ postgres_secret_name }}"
        namespace: "{{ postgres_namespace }}"

    - name: Summary (AAP "Jobs" tab / Developer Hub job output)
      ansible.builtin.set_stats:
        data:
          postgres_deleted: true
          postgres_namespace: "{{ postgres_namespace }}"
