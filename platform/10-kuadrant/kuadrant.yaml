apiVersion: v1
kind: Namespace
metadata:
  name: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/sync-options: Delete=false   # may be shared with other Kuadrant users
---
# Kuadrant instance: creates Authorino (auth) and Limitador (token rate limits)
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
    argocd.argoproj.io/sync-options: Delete=false
spec:
  observability:
    enable: true
  # The Dev Portal (APIProduct, APIKeyRequest/APIKeyApproval/APIKey, self-service plans): the
  # platform engineering piece of docs/demos/10-connectivity.md. Off by default upstream; on here
  # so the APIProduct/devportal CRDs are actually reconciled (otherwise they sit with no status).
  components:
    developerPortal:
      enabled: true
