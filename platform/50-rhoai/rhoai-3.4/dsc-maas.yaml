# RHOAI 3.4: MaaS lives under the kserve component
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    kserve:
      managementState: Managed
      modelsAsService:
        managementState: Managed
    # Llama Stack operator: backs the Gen AI studio playground in 3.4
    llamastackoperator:
      managementState: Managed
    # MLflow tracking server operator (instance: stack/rhoai/mlflow.yaml)
    mlflowoperator:
      managementState: Managed
    # Model registry + model catalog (namespace rhoai-model-registries). The registry instance
    # is stack/rhoai/model-registry.yaml; the model catalog is what Developer Hub's OpenShift AI
    # connector reads for the model cards (TechDocs) of the deployed models.
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
