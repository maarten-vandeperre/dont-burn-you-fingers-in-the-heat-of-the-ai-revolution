# Authorino with its TLS listener enabled (cert issued by the service-ca operator).
# Full spec so it works whether or not Kuadrant already created the instance.
apiVersion: operator.authorino.kuadrant.io/v1beta1
kind: Authorino
metadata:
  name: authorino
  namespace: kuadrant-system
spec:
  clusterWide: true
  replicas: 1
  listener:
    tls:
      enabled: true
      certSecretRef:
        name: authorino-server-cert
  oidcServer:
    tls:
      enabled: false
  # The service CA, at the path deploy.sh points SSL_CERT_FILE / REQUESTS_CA_BUNDLE to. Authorino
  # calls maas-api over TLS (API key validation, subscription selection); without this file it
  # cannot verify maas-api's service-ca cert ("tls: bad certificate" in the maas-api log) and
  # every MaaS API key is rejected with 403. Set on the CR so the operator keeps it.
  volumes:
    items:
      - name: openshift-service-ca
        mountPath: /etc/ssl/certs/openshift-service-ca
        configMaps:
          - openshift-service-ca.crt
        items:
          - key: service-ca.crt
            path: service-ca-bundle.crt
