# Realm "demo": the user for every UI and the OIDC clients. Values in ${...} come from the
# keycloak-sso-demo Secret (placeholders), so no password or client secret is stored in git.
# Imported once; later changes are made in the Keycloak admin console.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: demo-realm
spec:
  keycloakCRName: platform-sso
  placeholders:
    DEMO_ADMIN_USER: {secret: {name: keycloak-sso-demo, key: DEMO_ADMIN_USER}}
    DEMO_ADMIN_PASSWORD: {secret: {name: keycloak-sso-demo, key: DEMO_ADMIN_PASSWORD}}
    DEVHUB_CLIENT_SECRET: {secret: {name: keycloak-sso-demo, key: DEVHUB_CLIENT_SECRET}}
    GITLAB_CLIENT_SECRET: {secret: {name: keycloak-sso-demo, key: GITLAB_CLIENT_SECRET}}
  realm:
    realm: demo
    displayName: AI platform demo
    enabled: true
    loginWithEmailAllowed: true
    groups:
      - name: platform-team
      - name: ai-app-team
    users:
      - username: ${DEMO_ADMIN_USER}
        enabled: true
        email: admin@demo.example.com
        emailVerified: true
        firstName: Demo
        lastName: Admin
        groups: [/platform-team, /ai-app-team]
        credentials:
          - type: password
            value: ${DEMO_ADMIN_PASSWORD}
            temporary: false
    clients:
      - clientId: developer-hub
        name: Red Hat Developer Hub
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${DEVHUB_CLIENT_SECRET}
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: REPLACED-BY-KUSTOMIZE
        redirectUris: [REPLACED-BY-KUSTOMIZE]
        webOrigins: ["+"]
      - clientId: gitlab
        name: GitLab
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${GITLAB_CLIENT_SECRET}
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: REPLACED-BY-KUSTOMIZE
        redirectUris: [REPLACED-BY-KUSTOMIZE]
        webOrigins: ["+"]
