apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - route.yaml
  - httproute.yaml
  - mesh-authorization.yaml
  - auth-policy.yaml
  - plan-policy.yaml
  - api-product.yaml
  - envoyfilter-authorino-tls.yaml

# Cluster specific value lives in cluster-params.env (written by:
# ./deploy.sh connectivity partner-api deploy), injected the same way as platform/30-gateway.
configMapGenerator:
  - name: partner-api-cluster-params
    envs:
      - cluster-params.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

replacements:
  - source:
      kind: ConfigMap
      name: partner-api-cluster-params
      fieldPath: data.PARTNER_API_HOSTNAME
    targets:
      - select:
          kind: Gateway
          name: partner-gateway
        fieldPaths:
          - spec.listeners.[name=http].hostname
      - select:
          kind: HTTPRoute
          name: partner-orders-api
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Route
          name: partner-api
        fieldPaths:
          - spec.host
