# The "legacy" database. Nothing special about it -- same image and env var convention as
# platform/40-postgres -- the point is entirely in how it is (not) reachable (network-policies.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: legacy-inventory-db-creds
  namespace: legacy-datacenter
type: Opaque
stringData:
  POSTGRESQL_USER: legacy_app
  POSTGRESQL_PASSWORD: change-me-legacy
  POSTGRESQL_DATABASE: legacy_inventory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-inventory-db
  namespace: legacy-datacenter
  labels:
    app: legacy-inventory-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: legacy-inventory-db
  template:
    metadata:
      labels:
        app: legacy-inventory-db
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16@sha256:3943bfa5de044d8f033df148c0409ed826171b779f3cf3ddf537a1914960ab57
          envFrom:
            - secretRef:
                name: legacy-inventory-db-creds
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["/usr/libexec/check-container"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-inventory-db
  namespace: legacy-datacenter
  labels:
    app: legacy-inventory-db
spec:
  selector:
    app: legacy-inventory-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
