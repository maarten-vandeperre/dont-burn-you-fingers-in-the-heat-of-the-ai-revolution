# Red Hat Ansible Automation Platform (AAP) 2.6 Operator -- namespace-scoped channel
# (stable-2.6), so the operator and everything it manages live together in one namespace.
# "aap" is Red Hat's own recommended namespace name (the operator refuses "default").
#
# Installed on its own, not as part of ./deploy.sh stack's install_operators(): this whole layer
# is an optional add-on, exactly like stack/connectivity and stack/tssc. ./deploy.sh ansible setup
# applies this file first and waits for the CRDs before the rest of stack/ansible.
#
# Needs a Red Hat Ansible Automation Platform subscription: the operator's own image comes from
# registry.redhat.io (reachable with any valid OpenShift pull secret that already has Red Hat
# credentials), but the Controller/Gateway/PostgreSQL *component* images need registry.redhat.io
# credentials of their own -- see ansible/README.md "Red Hat subscription and the image pull
# secret" for the one-time setup `./deploy.sh ansible setup` checks for and tells you about if
# it's missing.
apiVersion: v1
kind: Namespace
metadata:
  name: aap
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap
  namespace: aap
spec:
  targetNamespaces:
    - aap
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform
  namespace: aap
spec:
  channel: stable-2.6
  installPlanApproval: Automatic
  name: ansible-automation-platform-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
