apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - build.yaml
configMapGenerator:
  - name: claude-code-managed-settings
    namespace: agent-sandboxes
    files:
      - managed-settings.json
    options:
      disableNameSuffixHash: true   # referenced by name from the BuildConfigs
      labels:
        app.kubernetes.io/part-of: agent-sandboxes-demo
