# Red Hat Developer Hub as the single pane of glass for the platform: catalog of every component,
# Kubernetes / Topology / Tekton / Argo CD views, and software templates that change the platform.
# - cluster-params.env, catalog/ and dynamic-plugins.yaml are generated by ./deploy.sh rhdh
#   (commit them when you deploy with Argo CD)
# - the rhdh-secrets Secret (backend secret, tokens, Argo CD password, MCP token) is created by deploy.sh
# - Developer Lightspeed: lightspeed/app-config-lightspeed.yaml is applied here; the Secret
#   lightspeed-secrets and the ConfigMap lightspeed-stack-config are created by deploy.sh (a
#   placeholder / the base config) and completed by ./deploy.sh lightspeed setup, so a re-apply of
#   this layer never takes the LLM key or the platform-mcp server away again
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rhdh
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
resources:
  - namespace.yaml
  - rbac.yaml
  - app-config.yaml
  - backstage.yaml
  - lightspeed/app-config-lightspeed.yaml
configMapGenerator:
  - name: rhdh-cluster-params
    envs:
      - cluster-params.env
    options:
      disableNameSuffixHash: true
  - name: dynamic-plugins-rhdh
    files:
      - dynamic-plugins.yaml
    options:
      disableNameSuffixHash: true
  - name: rhdh-catalog
    files:
      - catalog/catalog-info.yaml
      - catalog/org.yaml
      - catalog/platform.yaml
      - catalog/models.yaml
      - catalog/ai-demo.yaml
      - catalog/apis.yaml
      - catalog/argo-rollouts-demo.yaml
      - catalog/template-traffic-pattern.yaml
      - catalog/template-model-router-rollout.yaml
      - catalog/template-scale-service.yaml
      - catalog/template-scale-model.yaml
      - catalog/template-coffee-menu-traffic.yaml
      - catalog/template-rollouts-canary.yaml
      - catalog/template-rollouts-bluegreen.yaml
      - catalog/template-rollouts-bluegreen-analysis.yaml
      - catalog/template-rollouts-canary-analysis.yaml
      - catalog/software-templates.yaml
    options:
      disableNameSuffixHash: true
