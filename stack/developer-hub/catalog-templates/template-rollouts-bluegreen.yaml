# Changes the bluegreen-demo Rollout through the /platform-actions proxy.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rollouts-bluegreen
  title: "Argo Rollouts: blue-green release"
  description: Release a new color to the preview Service, then promote it to active when ready (or abort / retry)
  tags: [argo-rollouts, blue-green]
spec:
  owner: platform-team
  type: platform-action
  parameters:
    - title: Action
      required: [action]
      properties:
        action:
          title: Action
          type: string
          default: release
          enum: [release, promote, abort, retry]
          enumNames: ["Release a new color (to preview)", "Promote (preview -> active)", "Abort (active never moves)", "Retry an aborted release"]
        color:
          title: Color
          type: string
          default: yellow
          enum: [blue, yellow, green, red]
          ui:help: Only used for "Release". docker.io/argoproj/rollouts-demo:<color>
  steps:
    - id: release
      if: ${{ parameters.action === 'release' }}
      name: New color (preview)
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/bluegreen-demo
        headers:
          content-type: application/json-patch+json
        body: '[{"op":"replace","path":"/spec/template/spec/containers/0/image","value":"docker.io/argoproj/rollouts-demo:${{ parameters.color }}"}]'
    - id: promote
      if: ${{ parameters.action === 'promote' }}
      name: Promote (active -> preview's color)
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/bluegreen-demo/status
        headers:
          content-type: application/merge-patch+json
        body: '{"status":{"pauseConditions":null}}'
    - id: abort
      if: ${{ parameters.action === 'abort' }}
      name: Abort
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/bluegreen-demo/status
        headers:
          content-type: application/merge-patch+json
        body: '{"status":{"abort":true}}'
    - id: retry
      if: ${{ parameters.action === 'retry' }}
      name: Retry
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/bluegreen-demo/status
        headers:
          content-type: application/merge-patch+json
        body: '{"status":{"abort":false}}'
  output:
    links:
      - title: rollouts-bluegreen in the catalog
        entityRef: component:default/rollouts-bluegreen
