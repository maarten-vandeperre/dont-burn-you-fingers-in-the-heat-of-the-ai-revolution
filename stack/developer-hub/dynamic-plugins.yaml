# Dynamic plugins of Developer Hub 2.1 (Backstage 1.54.9, new frontend system).
#
# Curated, not generated: 2.1 takes its default plugin list from the catalog index image
# (dynamic-plugins.default.yaml, included below) and ships no bundled ./dynamic-plugins/dist
# wrappers any more. Two kinds of references:
#   ref://<name>   a plugin of the supported catalog index, resolved to the digest pinned by Red Hat
#                  for this release (follows 2.1.z updates of the index automatically)
#   oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/<name>:bs_1.54.9__<version>
#                  community / dev-preview plugins that are not in the supported index. The tag must
#                  match the Backstage version of Developer Hub (bs_1.54.9 for 2.1).
# Frontend plugins wire themselves (new frontend system): no mountPoints / dynamicRoutes needed.
# Entity-page and header tweaks live in app-config-rhdh (app.extensions, globalHeader).
includes:
  - dynamic-plugins.default.yaml
plugins:
  # --- Sign-in: Keycloak (OIDC) -------------------------------------------------------------------
  # 2.1 ships the auth provider modules as plugins that are disabled by default; without this one
  # the sign-in page fails with "Unknown auth provider 'oidc'" (auth.providers.oidc in app-config).
  - package: ref://backstage-plugin-auth-backend-module-oidc-provider
    enabled: true

  # --- Kubernetes, Topology, Tekton, Argo CD views -----------------------------------------------
  - package: ref://backstage-plugin-kubernetes-backend
    enabled: true
  - package: ref://backstage-plugin-kubernetes
    enabled: true
  - package: ref://backstage-community-plugin-topology
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.54.9__4.0.5!backstage-community-plugin-tekton
    enabled: true
  # Argo CD: the community (Red Hat) backend replaces the Roadie one (roadiehq-backstage-plugin-argo-cd-backend)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.54.9__1.7.2
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.54.9__3.1.3
    enabled: true

  # --- Software templates: actions ---------------------------------------------------------------
  - package: ref://roadiehq-scaffolder-backend-module-http-request
    enabled: true
  - package: ref://backstage-community-plugin-scaffolder-backend-module-kubernetes
    enabled: true
  - package: ref://backstage-plugin-scaffolder-backend-module-gitlab
    enabled: true
  # argocd:create-resources (the LLM application template deploys itself through Argo CD)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:bs_1.54.9__1.9.0
    enabled: true

  # --- MCP: Developer Hub as an MCP server (Developer Preview) -----------------------------------
  # /api/mcp-actions/v1/<server>, tools from the plugins listed in backend.actions.pluginSources
  # (app-config-lightspeed): catalog, TechDocs, scaffolder, Kubernetes, Scorecard
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.54.9__0.2.1!backstage-plugin-mcp-actions-backend
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.54.9__0.2.5
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.54.9__0.2.6
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras:bs_1.54.9__0.4.4
    enabled: true
  # new in 2.1: get-kubernetes-clusters, get-kubernetes-resources-for-entity
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-kubernetes-mcp-extras:bs_1.54.9__0.2.0
    enabled: true

  # --- Scorecard (Tech Preview): service health per component, also exposed as MCP tools ---------
  # File checks (README, catalog-info, Dockerfile, ...) read through the GitLab integration.
  - package: ref://red-hat-developer-hub-backstage-plugin-scorecard
    enabled: true
  - package: ref://red-hat-developer-hub-backstage-plugin-scorecard-backend
    enabled: true
  - package: ref://red-hat-developer-hub-backstage-plugin-scorecard-backend-module-filecheck
    enabled: true

  # --- OpenShift AI connector + AI Catalog (Developer Preview) -----------------------------------
  # The connector watches KServe InferenceServices / LLMInferenceServices and the OpenShift AI
  # model catalog and publishes them as AiModelServerAPI entities (+ model cards as TechDocs).
  # 2.1 runs it in-process: the 1.x bridge sidecars (location, storage-rest, rhoai-normalizer)
  # are gone. Config: catalog.providers.modelCatalog.kserve-kubeflow-connector (app-config-rhdh).
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-kserve-kubeflow-connector-backend:bs_1.54.9__0.3.0
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-model-catalog:bs_1.54.9__1.1.0
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-model-server:bs_1.54.9__0.3.1
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-techdoc-url-reader-backend:bs_1.54.9__0.6.3
    enabled: true
  # AI Catalog page (/ai-catalog): models (AiModelServerAPI), MCP servers (API type mcp-server),
  # skills, rules and agents (AiResource)
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-ai-catalog:bs_1.54.9__1.0.1
    enabled: true
  # upstream kinds of the AI Catalog: API type mcp-server (spec.remotes instead of spec.definition)
  # and AiResource skill/rule; without it the built-in validator rejects mcp-server APIs
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-catalog-backend-module-ai-model:bs_1.54.9__0.1.3
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-resource-extensions:bs_1.54.9__0.5.2
    enabled: true
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-catalog-backend-module-ai-resource-agent:bs_1.54.9__0.4.1
    enabled: true

  # --- Agent-friendly CLI (rhdh-cli / backstage-cli "auth login"): OAuth2 consent page ------------
  - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-auth:bs_1.54.9__0.1.11!backstage-plugin-auth
    enabled: true
    pluginConfig:
      dynamicPlugins:
        frontend:
          backstage.plugin-auth:
            dynamicRoutes:
              - path: /oauth2/*
                importName: Router
