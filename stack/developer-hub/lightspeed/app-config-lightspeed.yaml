# Developer Lightspeed + MCP configuration of Developer Hub, a second app-config file next to
# app-config-rhdh (the Backstage CR lists both; this one is loaded last and wins on overlap).
# MCP_TOKEN lives in Secret rhdh/rhdh-secrets (created by deploy.sh, never in git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-lightspeed
data:
  app-config-lightspeed.yaml: |
    backend:
      auth:
        # Arrays are replaced, not merged, across app-config files: repeat the legacy entry of
        # app-config-rhdh and add the static token MCP clients (Lightspeed, platform-mcp, Cursor,
        # Claude, ...) use for /api/mcp-actions/v1/<server> and the catalog REST API.
        externalAccess:
          - type: legacy
            options:
              subject: legacy-default-config
              secret: ${BACKEND_SECRET}
          - type: static
            options:
              token: ${MCP_TOKEN}
              subject: mcp-clients
      # Which installed actions the MCP endpoint (mcp-actions-backend) exposes as MCP tools
      # (RHDH 1.10 "Interacting with MCP tools", Developer Preview):
      #   software-catalog-mcp-extras  fetch-catalog-entities, catalog-register/unregister, template metadata
      #   techdocs-mcp-extras          fetch-techdocs, analyze-techdocs-coverage, retrieve-techdocs-content
      #   scaffolder-mcp-extras        list actions/tasks, dry-run and execute software templates (on behalf of the caller)
      #   catalog, scaffolder          the core actions of the catalog and scaffolder backends
      actions:
        pluginSources:
          - software-catalog-mcp-extras
          - techdocs-mcp-extras
          - scaffolder-mcp-extras
          - catalog
          - scaffolder

    # Two MCP servers on the same actions (instead of the single /api/mcp-actions/v1):
    #   /api/mcp-actions/v1/backstage   every tool above (19): IDE agents (Cursor, Claude, VS Code,
    #                                   Continue) and large models
    #   /api/mcp-actions/v1/lightspeed  the catalog query only: Lightspeed sends the definitions of
    #                                   ALL tools of its MCP servers with every question, and 19 tool
    #                                   definitions alone overflow the 8k context of Qwen3-0.6B
    #                                   ("413 Prompt is too long"). With a bigger model (OpenAI, a
    #                                   32k+ model on GPU), point mcp-integration-tools in
    #                                   lightspeed-stack.yaml at /backstage instead.
    mcpActions:
      servers:
        backstage:
          name: Red Hat Developer Hub
          description: Software catalog, TechDocs and Software Templates (scaffolder) of Developer Hub
        lightspeed:
          name: Red Hat Developer Hub (compact)
          description: Software catalog query, small enough for small-context models
          filter:
            include:
              - id: 'software-catalog-mcp-extras:*'

    lightspeed:
      # One token per MCP server declared in lightspeed-stack.yaml (same names). The backend plugin
      # forwards them to Lightspeed Core in the MCP-HEADERS header ("Authorization: client").
      mcpServers:
        - name: mcp-integration-tools
          token: ${MCP_TOKEN}
        - name: platform-tools
          token: ${MCP_TOKEN}
      # Short and explicit on purpose: the default model is Qwen3-0.6B (8k context, CPU). Qwen3
      # reasons in <think>...</think> first; the chat UI shows that as a collapsible "reasoning" part.
      systemPrompt: |
        You are Developer Lightspeed, the assistant of this OpenShift AI platform in Red Hat Developer Hub.
        Always answer from live data by calling a tool first:
        - any CI, pipeline or build question: call get_ci_status. No name is needed: with NO arguments it returns
          the pipeline status of ALL catalog items (answer with its complete table). Only for one named item pass
          its name (include both links)
        - deployed, served or available AI models: call list_deployed_models
        - the software catalog, architecture, systems or how components relate: call get_catalog_overview
        - one component, API, resource or system (its linked components, deployments, everything): call get_component_details with its name
        Then answer briefly in Markdown, using only facts from the tool result. Keep names exactly as the tool wrote them.
        If a tool returns nothing useful, say so. Never invent components, models or statuses.
      # Welcome prompts in the Lightspeed chat
      prompts:
        - title: Deployed models
          message: Which models are deployed in OpenShift AI?
        - title: Catalog overview
          message: Give me an overview of the software catalog and how the components relate to each other.
        - title: Component status
          message: What is linked to the coffee-shop component and what is its CI status?
        - title: Catalog CI status
          message: Which items are in the catalog and what is their pipeline status? If no pipeline, say N/A.
        - title: CI of one component
          message: What is the CI status of coffee-shop? Give me the links.
        - title: Model router
          message: Show the details of model-router, which models does it depend on?
