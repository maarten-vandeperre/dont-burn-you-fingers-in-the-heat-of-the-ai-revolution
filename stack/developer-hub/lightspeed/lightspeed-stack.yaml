# Lightspeed Core Service (LCS) configuration of the lightspeed-core sidecar, mounted by the
# Backstage CR over the operator's default /app-root/lightspeed-stack.yaml (extraFiles, container
# lightspeed-core). Identical to the RHDH 1.10 operator default, plus one MCP server:
#
#   mcp-integration-tools  Developer Hub's own MCP endpoint (mcp-actions-backend plugin):
#                          software-catalog-mcp-extras actions (fetch-catalog-entities, ...)
#   platform-tools         platform-mcp (stack/lightspeed/mcp-server): deployed OpenShift AI models,
#                          catalog overview/relations, CI/CD/runtime status per component
#
# "Authorization: client" = the token comes from the caller: the Lightspeed backend plugin sends
# the per-server token of lightspeed.mcpServers (app-config-lightspeed) in the MCP-HEADERS header.
# The LLM itself is configured in the Llama Stack config (operator default, /app-root/config.yaml)
# through the env vars of Secret lightspeed-secrets (ENABLE_VLLM, VLLM_URL, VLLM_API_KEY, ...).
name: lightspeed-core-stack
service:
  host: ${env.SERVICE_HOST:=127.0.0.1}
  port: 8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
llama_stack:
  use_as_library_client: true
  library_client_config_path: /app-root/config.yaml
user_data_collection:
  feedback_enabled: true
  feedback_storage: '/tmp/data/feedback'
authentication:
  module: 'noop'
conversation_cache:
  type: 'sqlite'
  sqlite:
    db_path: '/tmp/cache.db'
customization:
  profile_path: '/app-root/rhdh-profile.py'
mcp_servers:
  - name: mcp-integration-tools
    provider_id: 'model-context-protocol'
    url: 'http://localhost:7007/api/mcp-actions/v1'
    authorization_headers:
      Authorization: 'client'
  - name: platform-tools
    provider_id: 'model-context-protocol'
    url: 'http://platform-mcp.rhdh.svc:8080/mcp'
    authorization_headers:
      Authorization: 'client'
