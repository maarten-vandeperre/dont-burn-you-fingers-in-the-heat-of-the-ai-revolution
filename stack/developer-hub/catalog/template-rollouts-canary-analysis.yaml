# Changes the canary-analysis-demo Rollout through the /platform-actions proxy. Each weight step
# runs the smoke test (AnalysisTemplate "smoke-test") before the next one; "Simulate a failure"
# arms both checks at once so a failure can be shown to auto-abort the rollout.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: rollouts-canary-analysis
  title: "Argo Rollouts: canary release (post-promotion analysis)"
  description: Release a new color; each weight step is checked by a smoke test before the next one runs
  tags: [argo-rollouts, canary, analysis]
spec:
  owner: platform-team
  type: platform-action
  parameters:
    - title: Action
      required: [action]
      properties:
        action:
          title: Action
          type: string
          default: release
          enum: [release, abort, retry]
          enumNames: ["Release a new color", "Abort (back to stable)", "Retry an aborted release"]
        color:
          title: Color
          type: string
          default: yellow
          enum: [blue, yellow, green, red]
          ui:help: Only used for "Release". docker.io/argoproj/rollouts-demo:<color>
        simulateFailure:
          title: Simulate a failure
          type: boolean
          default: false
          ui:help: Arms both smoke-test checks to fail on purpose, so the rollout aborts automatically at the first one. Only used for "Release".
  steps:
    - id: arm
      if: ${{ parameters.action === 'release' }}
      name: Arm/disarm the smoke test (both steps)
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/canary-analysis-demo
        headers:
          content-type: application/json-patch+json
        body: '[{"op":"replace","path":"/spec/strategy/canary/steps/1/analysis/args/1/value","value":"${{ parameters.simulateFailure }}"},{"op":"replace","path":"/spec/strategy/canary/steps/4/analysis/args/1/value","value":"${{ parameters.simulateFailure }}"}]'
    - id: release
      if: ${{ parameters.action === 'release' }}
      name: New color
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/canary-analysis-demo
        headers:
          content-type: application/json-patch+json
        body: '[{"op":"replace","path":"/spec/template/spec/containers/0/image","value":"docker.io/argoproj/rollouts-demo:${{ parameters.color }}"}]'
    - id: abort
      if: ${{ parameters.action === 'abort' }}
      name: Abort
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/canary-analysis-demo/status
        headers:
          content-type: application/merge-patch+json
        body: '{"status":{"abort":true}}'
    - id: retry
      if: ${{ parameters.action === 'retry' }}
      name: Retry
      action: http:backstage:request
      input:
        method: PATCH
        path: /proxy/platform-actions/apis/argoproj.io/v1alpha1/namespaces/rollouts-demo/rollouts/canary-analysis-demo/status
        headers:
          content-type: application/merge-patch+json
        body: '{"status":{"abort":false}}'
  output:
    links:
      - title: rollouts-canary-analysis in the catalog
        entityRef: component:default/rollouts-canary-analysis
