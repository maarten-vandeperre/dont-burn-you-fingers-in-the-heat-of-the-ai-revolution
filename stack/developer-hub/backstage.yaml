apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
spec:
  # Developer Lightspeed: the operator's "lightspeed" flavour (on by default, explicit here) adds the
  # lightspeed-core sidecar (Lightspeed Core Service + Llama Stack as a library), the RHDH docs RAG
  # init container and the Lightspeed frontend/backend plugins. ./deploy.sh lightspeed setup
  # connects it to a MaaS model and to the MCP tools (docs/demos/13-developer-lightspeed.md).
  flavours:
    - name: lightspeed
      enabled: true
  application:
    appConfig:
      mountPath: /opt/app-root/src
      configMaps:
        - name: app-config-rhdh
        - name: app-config-lightspeed     # Lightspeed + MCP endpoint (loaded last)
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    # catalog entities + software templates as files in /opt/app-root/src/catalog
    extraFiles:
      mountPath: /opt/app-root/src/catalog
      configMaps:
        - name: rhdh-catalog
        # Lightspeed Core config (its MCP servers) over the operator default, sidecar only
        - name: lightspeed-stack-config
          key: lightspeed-stack.yaml
          mountPath: /app-root
          containers: [lightspeed-core]
    extraEnvs:
      configMaps:
        - name: rhdh-cluster-params
      secrets:
        - name: rhdh-secrets
        # LLM provider of Lightspeed (ENABLE_VLLM, VLLM_URL, VLLM_API_KEY, ...), sidecar only.
        # Placeholder from deploy.sh until ./deploy.sh lightspeed setup fills it.
        - name: lightspeed-secrets
          containers: [lightspeed-core]
      envs:
        # in-cluster services (Argo CD, Kubernetes API) use the service CA / self-signed certs
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
    route:
      enabled: true
  database:
    enableLocalDb: true
