apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  - name: nemo-config-confidential
    namespace: ai-gateways
    files:
      - config/confidential/config.yaml
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/part-of: ai-gateways-demo
