# Demo 17: a compatibility shim for coding agents on /anthropic/ (HTTPRoute llm-api-anthropic).
#
# The problem: when a tool call fails (a command exits non-zero, or Claude Code's own permission
# rules deny it), Claude Code sends the next turn with a tool_result block marked
# "is_error": true. Praxis 0.9's Anthropic -> OpenAI Chat translation refuses ANY tool_result with
# is_error=true (400 "tool_result requires string `tool_use_id` and text `content`"; see
# praxis-proxy/ai apis/src/anthropic/messages_to_chat_completions/request.rs), because OpenAI
# Chat has no error flag on a tool message. The result: the agent session dies at the first
# failing command, which for a coding agent is every few minutes.
#
# The shim: drop the flag on the llm-gateway, before Praxis. The error text itself stays in the
# tool result ("Exit code 3 ...", "Permission ... denied"), so the model still sees what went
# wrong; only the boolean goes. A Praxis json_body filter can't do it: JSON Pointers have no
# wildcards (/messages/*/content/*/is_error matches nothing). Remove this file once Praxis maps
# is_error itself.
#
# Scope: only requests whose path starts with /anthropic/. The body is buffered (Envoy's buffer
# limit applies; long Claude Code sessions stay well under it).
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: llm-gateway-anthropic-tool-errors
  namespace: ai-gateways
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: llm-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_request(h)
                  local path = h:headers():get(":path") or ""
                  if string.sub(path, 1, 11) ~= "/anthropic/" then return end
                  local body = h:body(true)
                  if body == nil or body:length() == 0 then return end
                  local s = body:getBytes(0, body:length())
                  local a, b
                  s, a = string.gsub(s, ',%s*"is_error"%s*:%s*true', '')
                  s, b = string.gsub(s, '"is_error"%s*:%s*true%s*,?', '')
                  if a + b > 0 then
                    body:setBytes(s)
                    h:headers():replace("content-length", tostring(#s))
                    h:headers():replace("x-tool-errors-unflagged", tostring(a + b))
                  end
                end
