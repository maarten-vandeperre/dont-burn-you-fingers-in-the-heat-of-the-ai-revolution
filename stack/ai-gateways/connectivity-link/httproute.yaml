# Persona: AI platform / model owner. Path-based routing, one prefix per model: Gateway API
# matches on path, headers and query, never on the JSON body. (MaaS adds body-based routing on
# top with its payload-processing ext_proc; Praxis does it natively with model_to_header.)
#
#   /qwen3-0-6b/v1/chat/completions      -> qwen3-0-6b-kserve-workload-svc:8000      /v1/chat/completions
#   /gemma-3-270m-it/v1/chat/completions -> gemma-3-270m-it-kserve-workload-svc:8000 /v1/chat/completions
#
# TLS to the workloads comes from the DestinationRules KServe already created in maas-models
# (exportTo "*", service CA): the same ones the MaaS gateway uses.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-models
  namespace: ai-gateways
spec:
  parentRefs:
    - name: llm-gateway
  hostnames:
    - REPLACED-BY-KUSTOMIZE
  rules:
    - matches:
        - path: {type: PathPrefix, value: /qwen3-0-6b/v1/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /v1/}
      backendRefs:
        - name: qwen3-0-6b-kserve-workload-svc
          namespace: maas-models
          port: 8000
      timeouts: {request: 0s, backendRequest: 0s}   # CPU models: no gateway timeout
    - matches:
        - path: {type: PathPrefix, value: /gemma-3-270m-it/v1/}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /v1/}
      backendRefs:
        - name: gemma-3-270m-it-kserve-workload-svc
          namespace: maas-models
          port: 8000
      timeouts: {request: 0s, backendRequest: 0s}
---
# Cross-namespace backendRef: maas-models has to allow HTTPRoutes from ai-gateways to point at
# its Services. Owned by whoever owns maas-models, not by the gateway team.
# One ReferenceGrant per Service: the openshift-default gateway controller only honoured the
# first entry of a multi-entry `to:` list on this cluster (the second backend stayed
# RefNotPermitted -> 500 cluster_not_found).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ai-gateways-qwen
  namespace: maas-models
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ai-gateways}
  to:
    - {group: "", kind: Service, name: qwen3-0-6b-kserve-workload-svc}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-ai-gateways-gemma
  namespace: maas-models
spec:
  from:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, namespace: ai-gateways}
  to:
    - {group: "", kind: Service, name: gemma-3-270m-it-kserve-workload-svc}
