# Captures every change in inventory.customers / inventory.orders and coffee.orders /
# coffee.order_lines into topics inventory.<schema>.<table>. Try it: ./deploy.sh cdc-demo
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata:
  name: inventory-postgres
  labels:
    strimzi.io/cluster: debezium
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: inventory-db.kafka.svc.cluster.local
    database.port: 5432
    database.user: postgres
    database.password: ${secrets:kafka/inventory-db:admin-password}
    database.dbname: inventory
    topic.prefix: inventory
    plugin.name: pgoutput
    publication.autocreate.mode: filtered
    table.include.list: inventory.customers,inventory.orders,coffee.orders,coffee.order_lines
