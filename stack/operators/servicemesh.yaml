# OpenShift Service Mesh 3 (Sail operator) + Kiali. On OpenShift 4.22 the cluster ingress
# operator runs Gateway API through the embedded Sail library, so this subscription no
# longer collides with the MaaS gateway (no OLM-owned servicemeshoperator3 subscription).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: servicemeshoperator3
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: servicemeshoperator3
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kiali-ossm
  namespace: openshift-operators
spec:
  channel: stable
  installPlanApproval: Automatic
  name: kiali-ossm
  source: redhat-operators
  sourceNamespace: openshift-marketplace
