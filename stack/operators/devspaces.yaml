# Red Hat OpenShift Dev Spaces (browser IDE; commits are signed there with gitsign + RHTAS).
# The CheCluster CR itself is applied by stack/devspaces (apply_layer in deploy_stack_oc(), and
# standalone by stack/tssc/tssc.sh's devspaces() for './deploy.sh tssc setup' without './deploy.sh stack').
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: devspaces
  namespace: openshift-operators
spec:
  channel: stable
  name: devspaces
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
