# Mesh-wide: every sidecar reports spans to the shared collector (100% sampling for demos,
# lower randomSamplingPercentage in production)
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: otel-tracing
      randomSamplingPercentage: 100
