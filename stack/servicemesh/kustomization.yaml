# OpenShift Service Mesh 3 with tracing (-> stack/tracing) and Kiali (metrics from
# OpenShift user workload monitoring, traces from Tempo). The mesh only manages namespaces
# labelled istio-discovery=enabled, so it never touches the MaaS gateway in openshift-ingress.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
resources:
  - namespaces.yaml
  - istio.yaml
  - telemetry.yaml
  - monitoring.yaml
  - kiali.yaml
  - demo
