# Vulnerability data for the SBOM checks. The public sources are large (the CVE list and the GitHub
# advisory database are Git repositories of several GB) and take a while to ingest, so they are off
# by default. Enable them with: ./deploy.sh tssc setup --tpa-importers
modules:
  createImporters:
    enabled: true
    importers:
      cve:
        cve:
          description: CVE list v5
          period: 1d
          source: https://github.com/CVEProject/cvelistV5
          disabled: true
      osv-github:
        osv:
          description: GitHub Advisory Database
          period: 1d
          source: https://github.com/github/advisory-database
          path: advisories
          disabled: true
      redhat-csaf:
        csaf:
          description: All Red Hat CSAF data
          period: 1d
          source: redhat.com
          disabled: true
          fetchRetries: 50
