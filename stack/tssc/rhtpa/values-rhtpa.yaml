# Trusted Profile Analyzer (Helm chart openshift-helm-charts/redhat-trusted-profile-analyzer),
# after the "Red Hat services" template of the RHTPA 2 Deployment Guide, adapted for a demo:
# filesystem storage instead of S3, the PoC PostgreSQL rhtpa-db, the platform Keycloak (realm demo).
# __ISSUER__ is filled in by tssc.sh; appDomain is passed with --set-string.
ingress:
  className: openshift-default
  additionalAnnotations:
    "haproxy.router.openshift.io/timeout": "5m"

storage:
  type: filesystem
  # 20Gi, not the chart's own 10Gi default: this filesystem (ext4 on Ceph RBD) ties its *inode*
  # budget to its byte size at mkfs time (bytes-per-inode ratio set once, at creation) -- at 10Gi
  # it got only 640K inodes, which the CVE/GitHub-advisory importers (./deploy.sh tssc setup
  # --tpa-importers ingests hundreds of thousands of small documents) fully exhausted well before
  # the *byte* capacity looked full (confirmed live: `df -h` 40% used, `df -i` 100% used, uploads
  # then fail with HTTP 500 "StorageFull"/"No space left on device"). Must match the PVC size
  # tssc.sh's rhtpa() pre-creates (see its "Chart bug workaround" comment) -- bump both together.
  size: 20Gi

database:
  sslMode: disable
  host:
    valueFrom: {secretKeyRef: {name: postgresql-credentials, key: db.host}}
  port:
    valueFrom: {secretKeyRef: {name: postgresql-credentials, key: db.port}}
  name:
    valueFrom: {secretKeyRef: {name: postgresql-credentials, key: db.name}}
  username:
    valueFrom: {secretKeyRef: {name: postgresql-credentials, key: db.user}}
  password:
    valueFrom: {secretKeyRef: {name: postgresql-credentials, key: db.password}}

createDatabase:
  name:
    valueFrom: {secretKeyRef: {name: postgresql-admin-credentials, key: db.name}}
  username:
    valueFrom: {secretKeyRef: {name: postgresql-admin-credentials, key: db.user}}
  password:
    valueFrom: {secretKeyRef: {name: postgresql-admin-credentials, key: db.password}}

migrateDatabase:
  username:
    valueFrom: {secretKeyRef: {name: postgresql-admin-credentials, key: db.user}}
  password:
    valueFrom: {secretKeyRef: {name: postgresql-admin-credentials, key: db.password}}

modules:
  createDatabase:
    enabled: true
  migrateDatabase:
    enabled: true

oidc:
  issuerUrl: __ISSUER__
  clients:
    frontend:
      clientId: rhtpa-frontend
    cli:
      clientId: rhtpa-cli
      clientSecret:
        valueFrom: {secretKeyRef: {name: oidc-cli, key: client-secret}}
