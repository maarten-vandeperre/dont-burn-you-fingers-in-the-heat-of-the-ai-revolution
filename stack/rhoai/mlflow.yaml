# Cluster scoped, must be named "mlflow"; the operator runs it in redhat-ods-applications.
# Dev/test sizing (SQLite + PVC). For production use backendStoreUriFrom (PostgreSQL) and
# S3 artifacts, see "Working with MLflow" in the OpenShift AI 3.4 docs.
# Opens from the RHOAI dashboard: Applications > MLflow UI.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
spec:
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "file:///mlflow/artifacts"
  serveArtifacts: true
