# MLflow tracking server and the model registry instance. The mlflowoperator and modelregistry
# components themselves are switched on in platform/50-rhoai/rhoai-3.x/dsc-maas.yaml (one owner
# per DSC field).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
resources:
  - mlflow.yaml
  - model-registry.yaml
  - model-catalog-sources.yaml   # "Platform models" source: model cards of the served models
